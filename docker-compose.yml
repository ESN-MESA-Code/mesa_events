# The app on a VPS. Supabase runs self-hosted next to it (Supabase's own
# docker-compose, https://supabase.com/docs/guides/self-hosting/docker) or
# hosted; point the variables in .env at it. Put a TLS reverse proxy
# (Caddy, nginx) in front for your own domain.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_GOOGLE_WORKSPACE_DOMAIN: ${NEXT_PUBLIC_GOOGLE_WORKSPACE_DOMAIN:-esnmesa.org}
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
