# Continuous integration: the same checks as locally (README, "Tests").
# Everything runs against a local Supabase stack inside the runner (Supabase
# CLI + Docker) with the fixed local demo keys and fake Google services – no
# secrets and no external services are needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit tests, generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Generated server actions match lib/actions
        run: npm run gen:actions -- --check
      - run: npm audit --omit=dev --audit-level=high

  db:
    name: Database and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the local Supabase stack (migrations + seed)
        run: npm run supabase:start
      - name: Database types match the migrations
        run: |
          npm run gen:types
          git diff --exit-code types/database.ts
      - run: npm run test:db

  e2e:
    name: End-to-end (production build) and bundle scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the local Supabase stack (migrations + seed)
        run: npm run supabase:start
      - run: npm run build:local
      - name: No secrets or local sign-in in the browser bundle
        run: npm run test:bundle
      - name: Playwright against the standalone build
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (local demo values, not pushed)
        run: >
          docker build
          --build-arg NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54421
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=local-anon-key
          -t mesa-events:ci .
      - name: The container serves the login page
        run: |
          docker run -d --name mesa -p 3000:3000 -e APP_BASE_URL=http://localhost:3000 -e JOBS_SECRET=ci-only mesa-events:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/login > /dev/null && break; sleep 1; done
          curl -fsS http://localhost:3000/login | grep -q "MESA"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/jobs/run)" = "401"
